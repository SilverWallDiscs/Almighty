name: Release Almighty

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: almighty-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    if: ${{ github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid stable version: $version" }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match app version $tag" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding utf8
      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Prepare installer and SHA-256 checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          Copy-Item $installer.FullName "dist-release/Almighty-setup.exe"
          $hash = (Get-FileHash "dist-release/Almighty-setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Almighty-setup.exe" | Set-Content "dist-release/Almighty-setup.exe.sha256" -Encoding ascii
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Almighty v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            dist-release/Almighty-setup.exe
            dist-release/Almighty-setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
